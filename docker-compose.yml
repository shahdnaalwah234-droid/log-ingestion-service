services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logs_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations/001_create_logs.sql:/docker-entrypoint-initdb.d/001_create_logs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres_data:
