services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logs_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOADGEN_API_KEY: ${LOADGEN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db
    command: ["postgres", "-c", "synchronous_commit=off", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres_data:
